<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Es Kelapa Segar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/react-icons/fa/index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;background:#F5F5F5}
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'orange-600': '#EE4D2D',
          'green-700': '#2D6A4F',
          'blue-600': '#1976D2',
        }
      }
    }
  }
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const { FaShoppingCart, FaCog } = window.ReactIcons.Fa;

function App(){
  const [isAdmin, setIsAdmin] = useState(false)
  const [menu, setMenu] = useState(JSON.parse(localStorage.getItem('menu')) || [
    {id:1,nama:'Es Kelapa Original',harga:12000,img:'https://images.unsplash.com/photo-1601004890684-d8cbf643f5f1?w=400'},
    {id:2,nama:'Es Kelapa + Nata',harga:15000,img:'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400'},
    {id:3,nama:'Es Kelapa + Selasih',harga:16000,img:'https://images.unsplash.com/photo-1544144433-d50aff500bqd?w=400'}
  ])
  const [keranjang, setKeranjang] = useState(JSON.parse(localStorage.getItem('keranjang')) || [])
  const [pesanan, setPesanan] = useState(JSON.parse(localStorage.getItem('pesanan')) || [])
  const [showCart, setShowCart] = useState(false)
  const [nomorAdmin, setNomorAdmin] = useState(localStorage.getItem('nomorAdmin') || '628123456789')

  useEffect(()=>{localStorage.setItem('menu',JSON.stringify(menu))},[menu])
  useEffect(()=>{localStorage.setItem('keranjang',JSON.stringify(keranjang))},[keranjang])
  useEffect(()=>{localStorage.setItem('pesanan',JSON.stringify(pesanan))},[pesanan])
  useEffect(()=>{localStorage.setItem('nomorAdmin',nomorAdmin)},[nomorAdmin])

  const tambahKeranjang = (item)=>{
    const k = keranjang.find(i=>i.id===item.id);
    if(k){k.qty++; setKeranjang([...keranjang])}
    else {setKeranjang([...keranjang,{...item,qty:1}])}
  }

  const kirimWA = (no, msg)=> window.open(`https://wa.me/${no}?text=${encodeURIComponent(msg)}`, '_blank')

  const checkout = (nama, alamat, nohp)=>{
    if(!nama ||!alamat ||!nohp) return alert('Isi semua data dulu')
    const order = {id:'KL'+Date.now().toString().slice(-6), waktu:new Date().toLocaleString('id-ID'), customer:{nama,alamat,nohp}, items:keranjang, total:keranjang.reduce((a,b)=>a+b.harga*b.qty,0), status:'Baru'}
    setPesanan([order,...pesanan]); setKeranjang([]); setShowCart(false);
    let msg = `PESANAN BARU ${order.id}%0ANama: ${nama}%0AAlamat: ${alamat}%0A`; order.items.forEach(i=>msg+=`- ${i.nama} x${i.qty}%0A`); msg+=`Total: Rp${order.total.toLocaleString()}`
    kirimWA(nomorAdmin, msg)
    alert('Pesanan terkirim! Admin akan hubungi kamu')
  }

  const updateStatus = (id, status)=>{
    const newPesanan = pesanan.map(p => p.id === id? {...p, status} : p);
    setPesanan(newPesanan)
    const p = newPesanan.find(x=>x.id===id);
    if(status==='Proses') kirimWA(p.customer.nohp, `Halo ${p.customer.nama}, pesanan #${id} sedang kami buat ya 🥥`)
    if(status==='Selesai') kirimWA(p.customer.nohp, `Halo ${p.customer.nama}, pesanan #${id} sudah selesai! Terima kasih 🙏`)
    alert(`Status diubah ke ${status}`)
  }

  return (
    <div>
      <header className='sticky top-0 bg-orange-600 text-white p-4 flex justify-between items-center shadow-lg z-10'>
        <h1 className='font-bold text-xl'>🥥 Es Kelapa Segar</h1>
        <div className='flex gap-3'>
          {!isAdmin && <button onClick={()=>setShowCart(true)} className='relative'><FaShoppingCart size={24}/><span className='absolute -top-2 -right-2 bg-red-500 rounded-full px-2 text-xs'>{keranjang.reduce((a,b)=>a+b.qty,0)}</span></button>}
          <button onClick={()=>setIsAdmin(!isAdmin)} className='bg-blue-600 px-3 py-1 rounded-lg flex items-center gap-1'><FaCog/> {isAdmin?'Customer':'Admin'}</button>
        </div>
      </header>

      {!isAdmin? (
        <div className='p-4 grid grid-cols-2 md:grid-cols-4 gap-4'>
          {menu.map(m=>(<div key={m.id} className='bg-white rounded-xl shadow p-3'>
            <img src={m.img} className='rounded-lg h-32 w-full object-cover'/>
            <h3 className='font-semibold mt-2'>{m.nama}</h3>
            <p className='text-orange-600 font-bold'>Rp{m.harga.toLocaleString()}</p>
            <button onClick={()=>tambahKeranjang(m)} className='w-full bg-green-700 text-white py-2 rounded-lg mt-2'>+ Tambah</button>
          </div>))}
          {showCart && <CartModal keranjang={keranjang} setKeranjang={setKeranjang} onClose={()=>setShowCart(false)} onCheckout={checkout}/>}
        </div>
      ) : (
        <div className='p-4'>
          <div className='bg-blue-100 p-3 rounded-lg mb-4'>
            <label className='text-sm'>Nomor WA Admin</label>
            <input value={nomorAdmin} onChange={e=>setNomorAdmin(e.target.value)} placeholder='628xxx' className='border p-2 rounded w-full'/>
          </div>
          <h2 className='font-bold text-lg mb-2'>Pesanan Masuk</h2>
          {pesanan.length === 0 && <p>Belum ada pesanan</p>}
          {pesanan.map(p=>(<div key={p.id} className='bg-white p-3 rounded-xl shadow mb-3 border-l-4 border-orange-600'>
            <div className='flex justify-between'>
              <b>#{p.id}</b>
              <span className={`text-xs px-2 py-1 rounded text-white ${p.status==='Baru'?'bg-orange-600':p.status==='Proses'?'bg-blue-600':'bg-green-700'}`}>{p.status}</span>
            </div>
            <p className='text-sm'>{p.waktu}</p>
            <p><b>{p.customer.nama}</b> - {p.customer.nohp}</p>
            <p className='font-bold'>Rp{p.total.toLocaleString()}</p>
            <button onClick={()=>updateStatus(p.id,'Proses')} className='bg-blue-600 text-white px-3 py-1 rounded mr-2 mt-2'>Proses</button>
            <button onClick={()=>updateStatus(p.id,'Selesai')} className='bg-green-700 text-white px-3 py-1 rounded mt-2'>Selesai</button>
          </div>))}
        </div>
      )}
    </div>
  )
}

function CartModal({keranjang, setKeranjang, onClose, onCheckout}){
  const [nama,setNama]=useState(''); const [alamat,setAlamat]=useState(''); const [nohp,setNohp]=useState('');
  const total = keranjang.reduce((a,b)=>a+b.harga*b.qty,0)
  return (<div className='fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-20'>
    <div className='bg-white rounded-xl p-4 w-full max-w-md'>
      <h2 className='font-bold text-lg mb-2'>Checkout</h2>
      <div className='max-h-40 overflow-auto'>{keranjang.map(i=><p key={i.id}>{i.nama} x{i.qty} = Rp{(i.harga*i.qty).toLocaleString()}</p>)}</div>
      <input placeholder='Nama' value={nama} onChange={e=>setNama(e.target.value)} className='border w-full p-2 rounded mt-2'/>
      <input placeholder='Alamat' value={alamat} onChange={e=>setAlamat(e.target.value)} className='border w-full p-2 rounded mt-2'/>
      <input placeholder='No HP 628xxx' value={nohp} onChange={e=>setNohp(e.target.value)} className='border w-full p-2 rounded mt-2'/>
      <p className='font-bold mt-2'>Total: Rp{total.toLocaleString()}</p>
      <button onClick={()=>onCheckout(nama,alamat,nohp)} className='w-full bg-green-700 text-white py-2 rounded mt-2'>Kirim Pesanan</button>
      <button onClick={onClose} className='w-full bg-gray-400 text-white py-2 rounded mt-2'>Tutup</button>
    </div>
  </div>)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
