<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Es Kelapa Segar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/react-icons@4.12.0/index.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif;background:#F5F5F5}</style>
<script>
  tailwind.config = { theme: { extend: { colors: {'orange-600':'#EE4D2D','green-700':'#2D6A4F','blue-600':'#1976D2'} } } }
</script>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const {useState, useEffect} = React;
const {FaShoppingCart, FaCog} = window.ReactIcons.fa;

function App(){
  const [isAdmin, setIsAdmin] = useState(false);
  const [menu, setMenu] = useState(JSON.parse(localStorage.getItem('menu')) || [
    {id:1,nama:'Es Kelapa Original',harga:12000,img:'https://images.unsplash.com/photo-1601004890684-d8cbf643f5f1?w=400'},
    {id:2,nama:'Es Kelapa + Nata',harga:15000,img:'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400'},
    {id:3,nama:'Es Kelapa + Selasih',harga:16000,img:'https://images.unsplash.com/photo-1544144433-d50aff500bqd?w=400'}
  ]);
  const [keranjang, setKeranjang] = useState(JSON.parse(localStorage.getItem('keranjang')) || []);
  const [pesanan, setPesanan] = useState(JSON.parse(localStorage.getItem('pesanan')) || []);
  const [showCart, setShowCart] = useState(false);
  const [nomorAdmin, setNomorAdmin] = useState(localStorage.getItem('nomorAdmin') || '628123456789');

  useEffect(()=>{localStorage.setItem('menu',JSON.stringify(menu))},[menu]);
  useEffect(()=>{localStorage.setItem('keranjang',JSON.stringify(keranjang))},[keranjang]);
  useEffect(()=>{localStorage.setItem('pesanan',JSON.stringify(pesanan))},[pesanan]);
  useEffect(()=>{localStorage.setItem('nomorAdmin',nomorAdmin)},[nomorAdmin]);

  const tambahKeranjang = (item)=>{
    const k = keranjang.find(i=>i.id===item.id);
    if(k){k.qty++; setKeranjang([...keranjang])}
    else {setKeranjang([...keranjang,{...item,qty:1}])}
  };

  const kirimWA = (no, msg)=> window.open(`https://wa.me/${no}?text=${encodeURIComponent(msg)}`, '_blank');

  const checkout = (nama, alamat, nohp)=>{
    if(!nama ||!alamat ||!nohp) return alert('Isi semua data dulu');
    const order = {id:'KL'+Date.now().toString().slice(-6), waktu:new Date().toLocaleString('id-ID'), customer:{nama,alamat,nohp}, items:keranjang, total:keranjang.reduce((a,b)=>a+b.harga*b.qty,0), status:'Baru'};
    setPesanan([order,...pesanan]); setKeranjang([]); setShowCart(false);
    let msg = `PESANAN BARU ${order.id}%0ANama: ${nama}%0AAlamat: ${alamat}%0A`; order.items.forEach(i=>msg+=`- ${i.nama} x${i.qty}%0A`); msg+=`Total: Rp${order.total.toLocaleString()}`;
    kirimWA(nomorAdmin, msg); alert('Pesanan terkirim!');
  };

  const updateStatus = (id, status)=>{
    const newPesanan = pesanan.map(p => p.id === id? {...p, status} : p);
    setPesanan(newPesanan);
    const p = newPesanan.find(x=>x.id===id);
    if(status==='Proses') kirimWA(p.customer.nohp, `Halo ${p.customer.nama}, pesanan #${id} sedang kami buat ya 🥥`);
    if(status==='Selesai') kirimWA(p.customer.nohp, `Halo ${p.customer.nama}, pesanan #${id} sudah selesai! Terima kasih 🙏`);
  };

  return e('div', {},
    e('header', {className:'sticky top-0 bg-orange-600 text-white p-4 flex justify-between items-center shadow-lg z-10'},
      e('h1', {className:'font-bold text-xl'}, '🥥 Es Kelapa Segar'),
      e('div', {className:'flex gap-3'},
       !isAdmin && e('button', {onClick:()=>setShowCart(true), className:'relative'},
          e(FaShoppingCart, {size:24}),
          e('span', {className:'absolute -top-2 -right-2 bg-red-500 rounded-full px-2 text-xs'}, keranjang.reduce((a,b)=>a+b.qty,0))
        ),
        e('button', {onClick:()=>setIsAdmin(!isAdmin), className:'bg-blue-600 px-3 py-1 rounded-lg flex items-center gap-1'},
          e(FaCog), isAdmin?'Customer':'Admin'
        )
      )
    ),
   !isAdmin?
    e('div', {className:'p-4 grid-cols-2 md:grid-cols-4 gap-4'},
     ...menu.map(m=> e('div', {key:m.id, className:'bg-white rounded-xl shadow p-3'},
        e('img', {src:m.img, className:'rounded-lg h-32 w-full object-cover'}),
        e('h3', {className:'font-semibold mt-2'}, m.nama),
        e('p', {className:'text-orange-600 font-bold'}, `Rp${m.harga.toLocaleString()}`),
        e('button', {onClick:()=>tambahKeranjang(m), className:'w-full bg-green-700 text-white py-2 rounded-lg mt-2'}, '+ Tambah')
      )),
      showCart && e(CartModal, {keranjang, setKeranjang, onClose:()=>setShowCart(false), onCheckout:checkout})
    )
    :
    e('div', {className:'p-4'},
      e('div', {className:'bg-blue-100 p-3 rounded-lg mb-4'},
        e('label', {className:'text-sm'}, 'Nomor WA Admin'),
        e('input', {value:nomorAdmin, onChange:e=>setNomorAdmin(e.target.value), placeholder:'628xxx', className:'border p-2 rounded w-full'})
      ),
      e('h2', {className:'font-bold text-lg mb-2'}, 'Pesanan Masuk'),
      pesanan.length === 0 && e('p', {}, 'Belum ada pesanan'),
     ...pesanan.map(p=> e('div', {key:p.id, className:'bg-white p-3 rounded-xl shadow mb-3 border-l-4 border-orange-600'},
        e('div', {className:'flex justify-between'},
          e('b', {}, `#${p.id}`),
          e('span', {className:`text-xs px-2 py-1 rounded text-white ${p.status==='Baru'?'bg-orange-600':p.status==='Proses'?'bg-blue-600':'bg-green-700'}`}, p.status)
        ),
        e('p', {className:'text-sm'}, p.waktu),
        e('p', {}, e('b', {}, p.customer.nama), ` - ${p.customer.nohp}`),
        e('p', {className:'font-bold'}, `Rp${p.total.toLocaleString()}`),
        e('button', {onClick:()=>updateStatus(p.id,'Proses'), className:'bg-blue-600 text-white px-3 py-1 rounded mr-2 mt-2'}, 'Proses'),
        e('button', {onClick:()=>updateStatus(p.id,'Selesai'), className='bg-green-700 text-white px-3 py-1 rounded mt-2'}, 'Selesai')
      ))
    )
  )
}

function CartModal({keranjang, setKeranjang, onClose, onCheckout}){
  const [nama,setNama]=useState(''); const [alamat,setAlamat]=useState(''); const [nohp,setNohp]=useState('');
  const total = keranjang.reduce((a,b)=>a+b.harga*b.qty,0);
  return e('div', {className:'fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-20'},
    e('div', {className:'bg-white rounded-xl p-4 w-full max-w-md'},
      e('h2', {className:'font-bold text-lg mb-2'}, 'Checkout'),
      e('div', {className:'max-h-40 overflow-auto'},...keranjang.map(i=>e('p', {key:i.id}, `${i.nama} x${i.qty} = Rp${(i.harga*i.qty).toLocaleString()}`))),
      e('input', {placeholder:'Nama', value:nama, onChange:e=>setNama(e.target.value), className:'border w-full p-2 rounded mt-2'}),
      e('input', {placeholder:'Alamat', value:alamat, onChange:e=>setAlamat(e.target.value), className:'border w-full p-2 rounded mt-2'}),
      e('input', {placeholder:'No HP 628xxx', value:nohp, onChange:e=>setNohp(e.target.value), className:'border w-full p-2 rounded mt-2'}),
      e('p', {className:'font-bold mt-2'}, `Total: Rp${total.toLocaleString()}`),
      e('button', {onClick:()=>onCheckout(nama,alamat,nohp), className:'w-full bg-green-700 text-white py-2 rounded mt-2'}, 'Kirim Pesanan'),
      e('button', {onClick:onClose, className:'w-full bg-gray-400 text-white py-2 rounded mt-2'}, 'Tutup')
    )
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
